<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Child and youth ADHD diagram showing how ADHD affects life outcomes and how treatment moderates and improves those trajectories">
  <title>Child and Youth ADHD, Treatment, and Life Outcomes</title>
  <defs>
    <marker id="adhd-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" class="ri-marker-muted"/>
    </marker>
    <marker id="adhd-arrow-secondary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" class="ri-marker-secondary"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="348" height="208" rx="10" class="ri-surface"/>
  <rect x="14" y="14" width="332" height="192" rx="8" class="ri-panel"/>

  <!-- Child & Youth ADHD node (left) -->
  <rect x="22" y="84" width="88" height="52" rx="10" class="ri-node-accent"/>
  <text x="66" y="105" text-anchor="middle" class="ri-text-small">Child &amp; Youth</text>
  <text x="66" y="122" text-anchor="middle" class="ri-text-accent-bold">ADHD</text>

  <!-- Treatment node (top-center, clearly separated from left and right boxes) -->
  <rect x="118" y="24" width="112" height="44" rx="10" class="ri-node-secondary"/>
  <text x="174" y="43" text-anchor="middle" class="ri-text-secondary-bold">Treatment</text>
  <text x="174" y="58" text-anchor="middle" class="ri-text-small">Medication &amp; Support</text>

  <!-- Diverging trajectories from ADHD to outcomes -->
  <!-- Improved trajectory (with treatment) -->
  <path d="M 110 104 C 150 100, 184 88, 236 78" class="ri-stroke-secondary-bold" marker-end="url(#adhd-arrow-secondary)"/>
  <!-- Baseline / untreated trajectory -->
  <path d="M 110 118 C 150 126, 184 142, 236 152" class="ri-stroke-muted-dashed" marker-end="url(#adhd-arrow-muted)"/>

  <!-- Treatment moderation arrow onto trajectory -->
  <line x1="174" y1="68" x2="174" y2="91" class="ri-stroke-secondary-bold" marker-end="url(#adhd-arrow-secondary)"/>

  <!-- Life outcomes panel (right, clearly separated from Treatment box) -->
  <rect x="242" y="26" width="96" height="168" rx="8" class="ri-surface"/>
  <text x="290" y="46" text-anchor="middle" class="ri-text-bold">Life Outcomes</text>

  <rect x="252" y="58" width="76" height="30" rx="6" class="ri-node"/>
  <text x="290" y="77" text-anchor="middle" class="ri-text-small">School</text>

  <rect x="252" y="100" width="76" height="30" rx="6" class="ri-node"/>
  <text x="290" y="119" text-anchor="middle" class="ri-text-small">Health</text>

  <rect x="252" y="142" width="76" height="30" rx="6" class="ri-node"/>
  <text x="290" y="161" text-anchor="middle" class="ri-text-small">Well-being</text>

  <!-- Legend captions -->
  <text x="174" y="176" text-anchor="middle" class="ri-text-secondary-small">Improved trajectory</text>
  <text x="174" y="192" text-anchor="middle" class="ri-text-small">Baseline risk</text>
</svg>
