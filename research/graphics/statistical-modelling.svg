<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Statistical modelling toolbox showing GLMs, splines and Gaussian processes, and hierarchical modelling">
  <title>Statistical modelling toolbox: GLM, Splines / GP, and Hierarchical</title>

  <rect x="6" y="6" width="348" height="208" rx="10" class="ri-surface"/>
  <text x="180" y="28" text-anchor="middle" class="ri-text-title">Modelling Toolbox</text>

  <!-- Panel 1: GLM -->
  <rect x="16" y="38" width="104" height="164" rx="8" class="ri-panel"/>
  <text x="68" y="58" text-anchor="middle" class="ri-text-bold">GLM</text>
  <line x1="28" y1="154" x2="108" y2="154" class="ri-axis"/>
  <line x1="28" y1="74" x2="28" y2="154" class="ri-axis"/>
  <!-- Scatter points -->
  <circle cx="38" cy="144" r="2.5" class="ri-fill-muted"/>
  <circle cx="48" cy="148" r="2.5" class="ri-fill-muted"/>
  <circle cx="58" cy="128" r="2.5" class="ri-fill-muted"/>
  <circle cx="66" cy="116" r="2.5" class="ri-fill-muted"/>
  <circle cx="76" cy="100" r="2.5" class="ri-fill-muted"/>
  <circle cx="88" cy="86" r="2.5" class="ri-fill-muted"/>
  <circle cx="100" cy="82" r="2.5" class="ri-fill-muted"/>
  <!-- Sigmoid link curve -->
  <path d="M 32 148 C 52 148, 58 124, 68 112 C 78 100, 86 82, 106 80" class="ri-stroke-accent-bold"/>
  <text x="68" y="176" text-anchor="middle" class="ri-text-small">g(E[Y]) = Xβ</text>

  <!-- Panel 2: Splines / GP -->
  <rect x="128" y="38" width="104" height="164" rx="8" class="ri-panel"/>
  <text x="180" y="58" text-anchor="middle" class="ri-text-bold">Splines / GP</text>
  <line x1="140" y1="154" x2="220" y2="154" class="ri-axis"/>
  <line x1="140" y1="74" x2="140" y2="154" class="ri-axis"/>
  <!-- Uncertainty band -->
  <path d="M 144 128 C 160 88, 174 134, 192 94 C 204 74, 212 86, 218 96 L 218 120 C 210 112, 202 104, 192 122 C 174 152, 160 114, 144 146 Z" class="ri-fill-secondary-soft"/>
  <!-- Smooth nonlinear curve -->
  <path d="M 144 137 C 160 101, 174 143, 192 108 C 204 89, 212 99, 218 108" class="ri-stroke-secondary-bold"/>
  <text x="180" y="176" text-anchor="middle" class="ri-text-small">Nonlinear f(x)</text>

  <!-- Panel 3: Hierarchical -->
  <rect x="240" y="38" width="104" height="164" rx="8" class="ri-panel"/>
  <text x="292" y="58" text-anchor="middle" class="ri-text-bold">Hierarchical</text>
  <!-- Tree edges -->
  <line x1="292" y1="88" x2="266" y2="112" class="ri-stroke-muted"/>
  <line x1="292" y1="88" x2="292" y2="112" class="ri-stroke-muted"/>
  <line x1="292" y1="88" x2="318" y2="112" class="ri-stroke-muted"/>
  <line x1="266" y1="126" x2="256" y2="146" class="ri-stroke-muted"/>
  <line x1="266" y1="126" x2="274" y2="146" class="ri-stroke-muted"/>
  <line x1="292" y1="126" x2="292" y2="146" class="ri-stroke-muted"/>
  <line x1="318" y1="126" x2="310" y2="146" class="ri-stroke-muted"/>
  <line x1="318" y1="126" x2="328" y2="146" class="ri-stroke-muted"/>
  <!-- Tree nodes -->
  <circle cx="292" cy="80" r="9" class="ri-node-tertiary"/>
  <circle cx="266" cy="119" r="7" class="ri-node-accent"/>
  <circle cx="292" cy="119" r="7" class="ri-node-accent"/>
  <circle cx="318" cy="119" r="7" class="ri-node-accent"/>
  <circle cx="256" cy="150" r="4" class="ri-fill-muted"/>
  <circle cx="274" cy="150" r="4" class="ri-fill-muted"/>
  <circle cx="292" cy="150" r="4" class="ri-fill-muted"/>
  <circle cx="310" cy="150" r="4" class="ri-fill-muted"/>
  <circle cx="328" cy="150" r="4" class="ri-fill-muted"/>
  <text x="292" y="176" text-anchor="middle" class="ri-text-small">Partial pooling</text>
</svg>
