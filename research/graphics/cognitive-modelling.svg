<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Cognitive modelling diagram showing a drift diffusion model on the left predicting both behavioral and brain data on the right">
  <title>Cognitive modelling: Drift Diffusion Model predicting Behavior and Brain data</title>
  <defs>
    <marker id="cognitive-modelling-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" class="ri-marker-accent"/>
    </marker>
    <marker id="cognitive-modelling-arrow-secondary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" class="ri-marker-secondary"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="348" height="208" rx="10" class="ri-surface"/>

  <!-- Left panel: Drift Diffusion Model (DDM) -->
  <rect x="14" y="18" width="164" height="184" rx="8" class="ri-panel"/>
  <text x="96" y="36" text-anchor="middle" class="ri-text-title">Drift Diffusion (DDM)</text>

  <!-- Upper RT distribution -->
  <path d="M 32 68 C 44 68, 54 46, 68 46 C 84 46, 102 66, 158 68 Z" class="ri-fill-accent-soft"/>
  <path d="M 32 68 C 44 68, 54 46, 68 46 C 84 46, 102 66, 158 68" class="ri-stroke-accent"/>

  <!-- Lower RT distribution -->
  <path d="M 32 162 C 48 162, 62 180, 78 180 C 94 180, 114 164, 158 162 Z" class="ri-fill-tertiary-soft"/>
  <path d="M 32 162 C 48 162, 62 180, 78 180 C 94 180, 114 164, 158 162" class="ri-stroke-tertiary"/>

  <!-- Upper & Lower decision boundaries -->
  <line x1="28" y1="68" x2="164" y2="68" class="ri-axis"/>
  <line x1="28" y1="162" x2="164" y2="162" class="ri-axis"/>
  <line x1="28" y1="68" x2="28" y2="162" class="ri-axis"/>

  <!-- Starting point z -->
  <circle cx="28" cy="116" r="3.5" class="ri-fill-accent"/>
  <text x="23" y="120" text-anchor="end" class="ri-text-small">z</text>

  <!-- Mean drift arrow v -->
  <line x1="32" y1="116" x2="116" y2="82" class="ri-stroke-muted-dashed"/>
  <text x="116" y="102" class="ri-text-accent-small">drift v</text>

  <!-- Noisy evidence accumulation trace -->
  <polyline points="28,116 38,122 48,108 58,114 68,98 78,104 88,86 98,92 108,78 118,68" class="ri-stroke-accent-bold"/>

  <!-- Predictive arrows from DDM (left) to Behavior (top-right) and Brain (bottom-right) -->
  <path d="M 178 90 C 194 90, 198 62, 218 62" class="ri-stroke-accent-bold" marker-end="url(#cognitive-modelling-arrow)"/>
  <path d="M 178 130 C 194 130, 198 158, 218 158" class="ri-stroke-secondary-bold" marker-end="url(#cognitive-modelling-arrow-secondary)"/>
  <text x="199" y="113" text-anchor="middle" class="ri-text-small">predicts</text>

  <!-- Top-right panel: Behavior -->
  <rect x="222" y="18" width="124" height="86" rx="8" class="ri-panel"/>
  <text x="284" y="35" text-anchor="middle" class="ri-text-bold">Behavior</text>
  <line x1="242" y1="81" x2="326" y2="81" class="ri-axis"/>
  <rect x="250" y="54" width="12" height="27" rx="2" class="ri-fill-accent"/>
  <rect x="268" y="44" width="12" height="37" rx="2" class="ri-fill-accent"/>
  <rect x="286" y="60" width="12" height="21" rx="2" class="ri-fill-tertiary"/>
  <rect x="304" y="68" width="12" height="13" rx="2" class="ri-fill-tertiary"/>
  <text x="284" y="96" text-anchor="middle" class="ri-text-small">Choice &amp; RT</text>

  <!-- Bottom-right panel: Brain -->
  <rect x="222" y="116" width="124" height="86" rx="8" class="ri-panel"/>
  <text x="284" y="133" text-anchor="middle" class="ri-text-bold">Brain</text>
  <path d="M 234 162 L 246 162 L 254 148 L 263 176 L 273 142 L 283 180 L 293 152 L 303 168 L 314 158 L 334 162" class="ri-stroke-secondary-bold"/>
  <text x="284" y="194" text-anchor="middle" class="ri-text-small">fMRI / EEG</text>
</svg>
