<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Causal inference diagram combining a DAG with confounder, treatment, and outcome linked to a potential outcomes estimator using weighted individual-level contrasts">
  <title>Causal inference: DAG and potential outcomes weighted contrast estimator</title>
  <defs>
    <marker id="causal-inference-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" class="ri-marker-muted"/>
    </marker>
    <marker id="causal-inference-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" class="ri-marker-accent"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="348" height="208" rx="10" class="ri-surface"/>

  <!-- Left panel: DAG -->
  <rect x="14" y="18" width="136" height="184" rx="8" class="ri-panel"/>
  <text x="82" y="36" text-anchor="middle" class="ri-text-title">DAG</text>

  <!-- DAG edges -->
  <line x1="70" y1="80" x2="50" y2="124" class="ri-stroke-muted" marker-end="url(#causal-inference-arrow)"/>
  <line x1="94" y1="80" x2="114" y2="124" class="ri-stroke-muted" marker-end="url(#causal-inference-arrow)"/>
  <line x1="60" y1="142" x2="100" y2="142" class="ri-stroke-accent-bold" marker-end="url(#causal-inference-arrow-accent)"/>

  <!-- DAG nodes -->
  <circle cx="82" cy="68" r="15" class="ri-node"/>
  <text x="82" y="72" text-anchor="middle" class="ri-text-bold">C</text>
  <text x="82" y="96" text-anchor="middle" class="ri-text-small">Confounder</text>

  <circle cx="44" cy="142" r="15" class="ri-node-accent"/>
  <text x="44" y="146" text-anchor="middle" class="ri-text-accent-bold">T</text>
  <text x="44" y="172" text-anchor="middle" class="ri-text-small">Treatment</text>

  <circle cx="120" cy="142" r="15" class="ri-node-secondary"/>
  <text x="120" y="146" text-anchor="middle" class="ri-text-secondary-bold">Y</text>
  <text x="120" y="172" text-anchor="middle" class="ri-text-small">Outcome</text>

  <!-- Connector arrow -->
  <line x1="152" y1="110" x2="164" y2="110" class="ri-stroke-accent" marker-end="url(#causal-inference-arrow-accent)"/>

  <!-- Right panel: Potential outcomes & weighted individual-level contrasts -->
  <rect x="166" y="18" width="180" height="184" rx="8" class="ri-panel"/>
  <text x="256" y="35" text-anchor="middle" class="ri-text-title">Estimator</text>

  <!-- Potential outcomes weighted contrast formula -->
  <rect x="174" y="42" width="164" height="24" rx="5" class="ri-node-accent"/>
  <text x="256" y="58" text-anchor="middle" class="ri-text-accent-small">τ̂ = Σ wᵢ · [Yᵢ(1) − Yᵢ(0)]</text>

  <!-- Column headers -->
  <text x="184" y="82" text-anchor="middle" class="ri-text-small">i</text>
  <text x="220" y="82" text-anchor="middle" class="ri-text-small">Weight wᵢ</text>
  <text x="296" y="82" text-anchor="middle" class="ri-text-small">Yᵢ(1) − Yᵢ(0)</text>
  <line x1="174" y1="88" x2="338" y2="88" class="ri-axis"/>

  <!-- Zero contrast reference line -->
  <line x1="286" y1="92" x2="286" y2="158" class="ri-stroke-dashed"/>

  <!-- Individual i = 1 -->
  <text x="184" y="106" text-anchor="middle" class="ri-text-small">1</text>
  <rect x="200" y="99" width="24" height="8" rx="3" class="ri-node-secondary"/>
  <line x1="286" y1="103" x2="316" y2="103" class="ri-stroke-accent-bold"/>
  <circle cx="316" cy="103" r="3.5" class="ri-fill-accent"/>

  <!-- Individual i = 2 -->
  <text x="184" y="128" text-anchor="middle" class="ri-text-small">2</text>
  <rect x="200" y="121" width="38" height="8" rx="3" class="ri-node-secondary"/>
  <line x1="286" y1="125" x2="328" y2="125" class="ri-stroke-accent-bold"/>
  <circle cx="328" cy="125" r="3.5" class="ri-fill-accent"/>

  <!-- Individual i = 3 -->
  <text x="184" y="150" text-anchor="middle" class="ri-text-small">3</text>
  <rect x="200" y="143" width="16" height="8" rx="3" class="ri-node-secondary"/>
  <line x1="286" y1="147" x2="270" y2="147" class="ri-stroke-muted"/>
  <circle cx="270" cy="147" r="3.5" class="ri-fill-muted"/>

  <!-- Summary weighted average -->
  <line x1="174" y1="164" x2="338" y2="164" class="ri-axis"/>
  <text x="256" y="179" text-anchor="middle" class="ri-text-accent-small">Weighted individual contrasts</text>
  <text x="256" y="193" text-anchor="middle" class="ri-text-small">Potential outcomes → ATE</text>
</svg>
