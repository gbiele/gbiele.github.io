name: publish

on:
  push:
    branches: [quarto, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check bibliography
        run: python scripts/check_bib.py
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - name: Render site
        id: render
        run: quarto render
      - name: Check internal links
        run: python scripts/check_internal_links.py _site
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml beautifulsoup4 pypdf
      - name: Run test suite
        run: python -m pytest -q
      - name: Check external links
        if: ${{ always() && !cancelled() && steps.render.outcome == 'success' }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --scheme http --scheme https --exclude-path _site/site_libs _site
          fail: false
          failIfEmpty: false
          jobSummary: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: render
    if: github.ref == 'refs/heads/master' && vars.PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
