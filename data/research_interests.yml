- id: causal-inference
  title: "Causal inference"
  description: "Focuses on identifying and estimating causal effects from observational, cohort, and population register data when randomized trials are infeasible or cannot capture long-term outcomes. Combines methodological work on confounding, attrition, missingness, and partial identification with applied target trial emulations examining the effects of ADHD interventions, parental income, and social factors on child health and educational outcomes."
  links:
    - label: "Causal inference projects & publications"
      href: "causalinf.html"
  papers:
    - deAguas2025a
    - VarnetPerez2025
    - Biele2019-fd

- id: bayesian-statistics
  title: "Bayesian statistics"
  description: "Uses Bayesian estimation and probabilistic programming (including Stan) to fit complex, domain-grounded models and quantify uncertainty transparently rather than relying on null hypothesis significance testing. Across large-scale epidemiological cohorts and experimental datasets, Bayesian hierarchical models help regularize estimates, address multiple comparisons, focus inference on practically meaningful effect sizes, and diagnose when model parameters cannot be reliably identified."
  links:
    - label: "Bayesian statistics projects & publications"
      href: "bayes.html"
  papers:
    - Biele2022-iz
    - Borge2019-th
    - Jones2021-kt

- id: statistical-modelling
  title: "Statistical modelling"
  description: "Develops and applies flexible statistical models—including multilevel regression, inverse probability weighting, partial identification bounds, and joint longitudinal models—that reflect the structure of complex observational, cohort, and registry data. A recurring theme is addressing real-world data challenges such as selection bias, missingness, measurement error, and confounding so that empirical estimates remain robust and interpretable in epidemiology and public health."
  links:
    - label: "Epidemiology & statistical modelling projects & publications"
      href: "epi.html"
  papers:
    - Brunborg2026-Consent
    - deAguas2025b
    - Biele2022-mb

- id: adhd
  title: "ADHD"
  description: "Investigates attention-deficit/hyperactivity disorder across the lifespan by combining Norwegian national health and education registries, the MoBa pregnancy cohort, clinical cohorts, and controlled experiments. This work spans early screening and developmental trajectories, comorbidities, prenatal and socioeconomic risk factors, cognitive mechanisms, and the long-term effects of stimulant medication and special educational support on school performance and mental health."
  links:
    - label: "ADHD projects & publications"
      href: "adhd.html"
  papers:
    - Cordier2026-SEN
    - Pedersen2026-Methylphenidate
    - Overgaard2024-Early

- id: cognitive-modelling
  title: "Cognitive modelling"
  description: "Applies formal computational models—such as reinforcement learning and drift diffusion sequential-sampling models—together with behavioral experiments and neuroimaging (fMRI, EEG) to study how humans learn from rewards, integrate social advice, and make decisions under uncertainty. This line of research also translates cognitive models to clinical populations, examining how decision-making and learning mechanisms differ in adults with ADHD and respond to stimulant medication."
  links:
    - label: "Decision making & neuroscience projects & publications"
      href: "decision-making.html"
  papers:
    - LundPedersen2017-ka
    - Ziegler2016-at
    - Biele2011-oo
